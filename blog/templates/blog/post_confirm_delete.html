{% extends 'blog/base.html' %}

{% block title %}Delete Article — BlogPulse{% endblock %}

{% block content %}
<div class="container">
  <div class="form-card" style="text-align: center;">
    <i class="fa-solid fa-triangle-exclamation" style="font-size: 3rem; color: #f87171; margin-bottom: 1rem;"></i>
    <h1 class="form-title">Delete Article</h1>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">
      Are you sure you want to permanently delete "<strong>{{ post.title }}</strong>"? This action cannot be undone.
    </p>

    <form method="POST">
      {% csrf_token %}
      <div style="display: flex; gap: 1rem; justify-content: center;">
        <a href="{% url 'post_detail' post.slug %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-danger"><i class="fa-solid fa-trash"></i> Yes, Delete Article</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
